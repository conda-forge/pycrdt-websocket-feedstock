{% set version = "0.16.2" %}

package:
  name: pycrdt-websocket
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pycrdt-websocket/pycrdt_websocket-{{ version }}.tar.gz
  sha256: 924333747f504f27784231870ecd39c380d73047698bf4dcc87de07b7b87522d

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - hatchling
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - anyio >=3.6.2,<5
    - pycrdt >=0.13.0,<0.14.0
    - pycrdt-store >=0.1.4,<0.2.0

test:
  source_files:
    - tests
  requires:
    - nodejs >=18,<19
    - pip
    - pytest-cov
    - httpx-ws >=0.5.2
    - hypercorn
    - trio >=0.25.0
    - sniffio
    - python {{ python_min }}
  imports:
    - pycrdt.websocket
  commands:
    - pip check

about:
  home: https://github.com/y-crdt/pycrdt-websocket
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: WebSocket connector for pycrdt
  doc_url: https://y-crdt.github.io/pycrdt-websocket

extra:
  recipe-maintainers:
    - davidbrochart
